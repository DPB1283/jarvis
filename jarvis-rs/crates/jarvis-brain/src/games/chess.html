<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess against Jarvis</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --line:#2a313c; --text:#e6edf3; --dim:#8b97a6; --teal:#2dd4bf; --light:#b7c0cc; --dark:#6b7a8f; --hi:#2dd4bf55; --last:#f5d66f55; --bad:#ff5f5f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, "Segoe UI", sans-serif; display:flex; justify-content:center; min-height:100vh; }
  main { width:min(96vw, 980px); padding:18px; display:grid; grid-template-columns: minmax(280px, 560px) 1fr; gap:22px; align-items:start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { grid-column:1/-1; margin:0; font-size:20px; font-weight:600; letter-spacing:.02em; }
  h1 span { color:var(--teal); }
  #board { display:grid; grid-template-columns:repeat(8,1fr); aspect-ratio:1; border:2px solid var(--line); border-radius:8px; overflow:hidden; user-select:none; }
  .sq { position:relative; display:flex; align-items:center; justify-content:center; font-size:min(8vw, 52px); cursor:pointer; }
  .sq.l { background:var(--light); } .sq.d { background:var(--dark); }
  .sq.last::after, .sq.sel::after, .sq.hint::after { content:""; position:absolute; inset:0; background:var(--last); }
  .sq.sel::after { background:var(--hi); } .sq.hint::after { background:#9b5cff66; }
  .sq.target::before { content:""; position:absolute; width:26%; height:26%; border-radius:50%; background:var(--hi); z-index:2; }
  .sq.target.cap::before { width:84%; height:84%; background:none; border:4px solid var(--hi); }
  .sq.check { box-shadow: inset 0 0 0 4px var(--bad); }
  .piece { position:relative; z-index:1; line-height:1; text-shadow:0 1px 2px #0006; }
  .piece.w { color:#fff; -webkit-text-stroke:1px #222; } .piece.b { color:#14181f; -webkit-text-stroke:1px #fff3; }
  .coord { position:absolute; font-size:10px; opacity:.65; pointer-events:none; z-index:3; color:#112; } .coord.f { right:3px; bottom:1px; } .coord.r { left:3px; top:1px; }
  aside { display:grid; gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  label { color:var(--dim); font-size:13px; } select, button { background:#202733; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font:inherit; cursor:pointer; }
  button:hover, select:hover { border-color:var(--teal); } button.primary { background:var(--teal); color:#04201c; border-color:var(--teal); font-weight:600; }
  #status { font-size:17px; min-height:26px; } #status.over { color:var(--teal); font-weight:600; } #status.warn { color:var(--bad); }
  #moves { max-height:230px; overflow:auto; display:grid; grid-template-columns:36px 1fr 1fr; gap:2px 8px; font-family:ui-monospace, Consolas, monospace; font-size:14px; } #moves .n { color:var(--dim); }
  #promo { position:fixed; inset:0; background:#000a; display:none; align-items:center; justify-content:center; z-index:10; } #promo.on { display:flex; }
  #promo div { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; gap:10px; } #promo button { font-size:40px; padding:6px 14px; }
  .thinking { color:var(--teal); animation:p 1s infinite; } @keyframes p { 50% { opacity:.4; } }
</style>
</head>
<body>
<main>
  <h1>Chess against <span>Jarvis</span></h1>
  <div id="board" aria-label="Chess board"></div>
  <aside>
    <div class="panel"><div id="status">Loading…</div></div>
    <div class="panel row">
      <label>Difficulty <select id="level">
        <option value="1">Beginner</option><option value="2">Easy</option><option value="3" selected>Medium</option><option value="4">Hard</option><option value="5">Expert</option>
      </select></label>
      <label>You play <select id="color"><option value="white">White</option><option value="black">Black</option><option value="random">Random</option></select></label>
      <button class="primary" id="new">New game</button>
    </div>
    <div class="panel row"><button id="undo">Undo move</button><button id="hint">Hint</button><button id="flip">Flip board</button></div>
    <div class="panel"><div id="moves"></div></div>
  </aside>
</main>
<div id="promo"><div id="promoChoices"></div></div>
<script type="module">
import { Chess } from "./chess.js";

const GLYPH = { p: "♟", n: "♞", b: "♝", r: "♜", q: "♛", k: "♚" };
const NAMES = { 1: "beginner", 2: "easy", 3: "medium", 4: "hard", 5: "expert" };
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const boardEl = $("board"), statusEl = $("status"), movesEl = $("moves");

const worker = new Worker("./engine-worker.js", { type: "module" });
let requestId = 0, pending = null;
worker.onmessage = e => { if (pending && e.data.id === pending.id) { const p = pending; pending = null; p.resolve(e.data); } };
const ask = payload => new Promise(resolve => { pending = { id: ++requestId, resolve }; worker.postMessage({ ...payload, id: requestId }); });

let chess = new Chess();
let you = "w";
let flipped = false;
let selected = null, targets = [], lastMove = null, hint = null, busy = false, over = false;

$("level").value = String(Math.min(5, Math.max(1, Number(params.get("level")) || 3)));
$("color").value = ["white", "black", "random"].includes(params.get("color")) ? params.get("color") : "white";

function start() {
  chess = new Chess();
  const c = $("color").value;
  you = c === "random" ? (Math.random() < 0.5 ? "w" : "b") : c === "white" ? "w" : "b";
  flipped = you === "b";
  selected = null; targets = []; lastMove = null; hint = null; over = false; busy = false;
  render();
  report();
  if (chess.turn() !== you) engineMove();
}

function squareAt(r, c) { return flipped ? String.fromCharCode(97 + (7 - c)) + (r + 1) : String.fromCharCode(97 + c) + (8 - r); }

function render() {
  boardEl.innerHTML = "";
  const check = chess.isCheck() ? chess.board().flat().find(p => p && p.type === "k" && p.color === chess.turn())?.square : null;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const sq = squareAt(r, c);
    const piece = chess.get(sq);
    const el = document.createElement("div");
    el.className = "sq " + (((r + c) % 2 === 0) ? "l" : "d");
    if (lastMove && (sq === lastMove.from || sq === lastMove.to)) el.classList.add("last");
    if (hint && (sq === hint.from || sq === hint.to)) el.classList.add("hint");
    if (sq === selected) el.classList.add("sel");
    if (sq === check) el.classList.add("check");
    const target = targets.find(m => m.to === sq);
    if (target) { el.classList.add("target"); if (target.captured) el.classList.add("cap"); }
    if (piece) { const p = document.createElement("span"); p.className = "piece " + piece.color; p.textContent = GLYPH[piece.type]; el.append(p); }
    if (c === 0) { const n = document.createElement("span"); n.className = "coord r"; n.textContent = sq[1]; el.append(n); }
    if (r === 7) { const n = document.createElement("span"); n.className = "coord f"; n.textContent = sq[0]; el.append(n); }
    el.addEventListener("click", () => click(sq));
    boardEl.append(el);
  }
  const history = chess.history();
  movesEl.innerHTML = "";
  for (let i = 0; i < history.length; i += 2) {
    const n = document.createElement("span"); n.className = "n"; n.textContent = `${i / 2 + 1}.`;
    const w = document.createElement("span"); w.textContent = history[i];
    const b = document.createElement("span"); b.textContent = history[i + 1] ?? "";
    movesEl.append(n, w, b);
  }
  movesEl.scrollTop = movesEl.scrollHeight;
  setStatus();
}

function setStatus(thinking) {
  statusEl.className = "";
  let text;
  if (chess.isCheckmate()) { text = chess.turn() === you ? "Checkmate. Jarvis wins." : "Checkmate! You win."; statusEl.className = "over"; }
  else if (chess.isStalemate()) { text = "Stalemate. It's a draw."; statusEl.className = "over"; }
  else if (chess.isThreefoldRepetition()) { text = "Draw by repetition."; statusEl.className = "over"; }
  else if (chess.isInsufficientMaterial()) { text = "Draw: not enough pieces to mate."; statusEl.className = "over"; }
  else if (chess.isDrawByFiftyMoves() || chess.isDraw()) { text = "Draw."; statusEl.className = "over"; }
  else if (thinking || chess.turn() !== you) { text = "Jarvis is thinking…"; statusEl.className = "thinking"; }
  else { text = chess.isCheck() ? "Check! Your move." : "Your move."; if (chess.isCheck()) statusEl.className = "warn"; }
  statusEl.textContent = text;
  over = chess.isGameOver();
}

function click(sq) {
  if (busy || over || chess.turn() !== you) return;
  hint = null;
  const mine = chess.get(sq)?.color === you;
  if (selected && targets.some(m => m.to === sq)) return tryMove(selected, sq);
  if (mine) { selected = sq; targets = chess.moves({ square: sq, verbose: true }); }
  else { selected = null; targets = []; }
  render();
}

function tryMove(from, to) {
  const options = chess.moves({ square: from, verbose: true }).filter(m => m.to === to);
  if (options.length > 1) {
    const choices = $("promoChoices"); choices.innerHTML = "";
    for (const p of ["q", "r", "b", "n"]) {
      const b = document.createElement("button"); b.textContent = GLYPH[p];
      b.onclick = () => { $("promo").classList.remove("on"); commit(from, to, p); };
      choices.append(b);
    }
    $("promo").classList.add("on");
    return;
  }
  commit(from, to, options[0]?.promotion);
}

function commit(from, to, promotion) {
  const move = chess.move({ from, to, promotion });
  lastMove = { from: move.from, to: move.to };
  selected = null; targets = [];
  render(); report();
  if (!over) engineMove();
}

async function engineMove() {
  busy = true; setStatus(true);
  const started = performance.now();
  const reply = await ask({ game: "chess", fen: chess.fen(), level: Number($("level").value) });
  // Never answer instantly: a beat of "thinking" feels fairer.
  const wait = 350 - (performance.now() - started);
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  busy = false;
  if (!reply.move || over) return;
  const move = chess.move({ from: reply.move.from, to: reply.move.to, promotion: reply.move.promotion });
  lastMove = { from: move.from, to: move.to };
  render(); report();
}

async function showHint() {
  if (busy || over || chess.turn() !== you) return;
  busy = true; statusEl.className = "thinking"; statusEl.textContent = "Looking for a good move…";
  const reply = await ask({ game: "chess", fen: chess.fen(), level: 4, timeMs: 1500 });
  busy = false;
  hint = reply.move ?? null; selected = null; targets = [];
  render();
  if (reply.move) statusEl.textContent = `Hint: ${reply.move.san}`;
}

function undo() {
  if (busy) return;
  // Take back Jarvis's reply and your move (or just your move if he hasn't answered).
  if (chess.turn() === you && chess.history().length >= 2) { chess.undo(); chess.undo(); }
  else if (chess.history().length >= 1) { chess.undo(); }
  lastMove = null; selected = null; targets = []; hint = null;
  render(); report();
}

function report() {
  const status = chess.isCheckmate() ? "checkmate" : chess.isStalemate() ? "stalemate" : chess.isDraw() ? "draw" : chess.isCheck() ? "check" : "playing";
  const state = {
    game: "chess", fen: chess.fen(), pgn: chess.pgn(), turn: chess.turn() === "w" ? "white" : "black",
    you: you === "w" ? "white" : "black", level: NAMES[$("level").value], status, over: chess.isGameOver(),
    winner: chess.isCheckmate() ? (chess.turn() === you ? "jarvis" : "you") : null,
    history: chess.history(), moves: chess.history().length,
  };
  fetch("./state", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) }).catch(() => {});
}

$("new").onclick = start; $("undo").onclick = undo; $("hint").onclick = showHint;
$("flip").onclick = () => { flipped = !flipped; render(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") { selected = null; targets = []; $("promo").classList.remove("on"); render(); } });
start();
</script>
</body>
</html>
